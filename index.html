<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Uplink v3.6 - TechPRO Stable</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #050508;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-amber: #ffae00;
            --neon-red: #ff3333;
            --terminal-green: #39ff14;
            --glass-bg: rgba(10, 15, 30, 0.85);
        }

        body {
            margin: 0; padding: 0; height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 243, 255, 0.05) 1px, transparent 1px), 
                linear-gradient(90deg, rgba(0, 243, 255, 0.05) 1px, transparent 1px);
            background-size: 50px 50px;
            font-family: 'Share Tech Mono', monospace;
            color: #fff;
            display: flex; justify-content: center; align-items: center; overflow: hidden;
            perspective: 1000px;
        }

        /* BOOT SCREEN */
        #bootOverlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: #000; z-index: 9999;
            display: flex; flex-direction: column; justify-content: center; align-items: center;
            font-family: 'Orbitron', sans-serif;
        }
        .boot-text { color: var(--neon-cyan); font-size: 1.5rem; margin-bottom: 20px; text-shadow: 0 0 10px var(--neon-cyan); }
        .progress-bar { width: 300px; height: 4px; background: #333; border-radius: 2px; position: relative; overflow: hidden; }
        .progress-fill { height: 100%; background: var(--neon-cyan); width: 0%; box-shadow: 0 0 10px var(--neon-cyan); animation: loadProgress 2.0s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
        .boot-log { margin-top: 15px; color: #555; font-family: 'Share Tech Mono', monospace; font-size: 0.8rem; height: 60px; text-align: center; }

        /* MAIN UI */
        .main-grid {
            display: grid; grid-template-columns: 1fr 1fr; gap: 20px;
            width: 95%; max-width: 1400px; height: 90vh;
            opacity: 0; transform: scale(0.8) translateZ(-100px); transition: all 0.8s cubic-bezier(0.175, 0.885, 0.32, 1.275); filter: blur(10px);
        }
        .system-ready { opacity: 1; transform: scale(1) translateZ(0); filter: blur(0); }

        .panel {
            background: var(--glass-bg); border: 1px solid rgba(255, 255, 255, 0.05);
            border-radius: 10px; padding: 20px; display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(0, 0, 0, 0.8); height: 100%; box-sizing: border-box;
            overflow: hidden; position: relative; backdrop-filter: blur(10px);
        }
        .panel-input { border-left: 3px solid var(--neon-cyan); }
        .panel-output { border-right: 3px solid var(--neon-amber); }

        h2 {
            font-family: 'Orbitron', sans-serif; margin-top: 0; font-size: 0.9rem; letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1); padding-bottom: 10px; margin-bottom: 10px;
            display: flex; gap: 10px; align-items: center; flex-wrap: wrap;
        }

        .calibration-control {
            display: flex; align-items: center; gap: 10px; font-size: 0.7rem; color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.2); padding: 5px 10px; border-radius: 5px; margin-left: auto;
        }
        input[type=range] { width: 80px; accent-color: var(--neon-cyan); cursor: pointer; }

        .control-btn {
            background: rgba(255,255,255,0.05); border: 1px solid #444; color: #aaa; padding: 6px 12px;
            font-family: 'Orbitron', sans-serif; cursor: pointer; border-radius: 4px; transition: all 0.2s;
            font-size: 0.7rem; display: flex; align-items: center; gap: 5px; text-transform: uppercase;
        }
        .control-btn:hover { background: rgba(255,255,255,0.1); border-color: #fff; color: #fff; }
        .btn-power.active { border-color: var(--terminal-green); color: var(--terminal-green); box-shadow: 0 0 15px rgba(57,255,20,0.1); }
        .btn-send { border-color: var(--neon-cyan); color: var(--neon-cyan); width: 100%; justify-content: center; margin-top: 10px; padding: 12px; letter-spacing: 1px;}
        .btn-send:hover { background: rgba(0, 243, 255, 0.15); box-shadow: 0 0 20px rgba(0, 243, 255, 0.2); }
        .btn-send:disabled { opacity: 0.3; cursor: not-allowed; }

        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
        .terminal-window { flex-grow: 1; background: rgba(0,0,0,0.3); border: 1px solid rgba(255,255,255,0.05); padding: 10px; overflow-y: auto; font-size: 0.8rem; margin-bottom: 10px; }
        .ai-display-area { flex-grow: 1; display: flex; flex-direction: column; gap: 10px; overflow-y: auto; padding-right: 5px; padding-bottom: 10px; }

        .ai-card {
            background: linear-gradient(90deg, rgba(255, 174, 0, 0.05) 0%, transparent 100%);
            border: 1px solid var(--neon-amber); border-left: 4px solid var(--neon-amber);
            border-radius: 4px; padding: 15px; padding-right: 40px;
            animation: cardEntrance 0.5s cubic-bezier(0.23, 1, 0.32, 1); position: relative; flex-shrink: 0;
        }
        .ai-context { font-size: 0.7rem; color: rgba(255,255,255,0.4); margin-bottom: 5px; border-bottom: 1px dashed rgba(255,174,0,0.2); padding-bottom: 5px; font-style: italic;}
        .ai-text { font-size: 1rem; color: #fff; line-height: 1.4; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.2); border: 1px solid var(--neon-amber); color: var(--neon-amber); width: 25px; height: 25px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; transition: 0.2s; }
        .copy-btn:hover { background: var(--neon-amber); color: #000; box-shadow: 0 0 10px var(--neon-amber); }

        .live-preview {
            flex-shrink: 0; padding: 10px; background: rgba(0, 243, 255, 0.02);
            border: 1px dashed rgba(0, 243, 255, 0.3); color: var(--neon-cyan);
            height: 70px; max-height: 70px; overflow-y: auto; font-size: 0.9rem;
            word-wrap: break-word; position: relative; transition: border-color 0.3s;
        }
        .buffer-warning { border-color: var(--neon-red); color: var(--neon-red); box-shadow: inset 0 0 10px rgba(255, 50, 50, 0.1); }
        .log-entry { margin-bottom: 4px; font-size: 0.75rem; opacity: 0.7; }
        .log-timestamp { color: var(--neon-pink); margin-right: 8px; }
        .footer { grid-column: 1 / -1; text-align: center; margin-top: 5px; font-size: 0.65rem; color: rgba(255,255,255,0.2); letter-spacing: 2px; text-transform: uppercase;}

        @keyframes loadProgress { 0% { width: 0%; } 100% { width: 100%; } }
        @keyframes cardEntrance { from { opacity: 0; transform: translateX(-20px) scale(0.95); } to { opacity: 1; transform: translateX(0) scale(1); } }
    </style>
</head>
<body>

    <div id="bootOverlay">
        <div class="boot-text">TECHPRO SYSTEMS</div>
        <div class="progress-bar"><div class="progress-fill"></div></div>
        <div class="boot-log" id="bootLog">Initializing...</div>
    </div>

    <div class="main-grid" id="mainInterface">
        <div class="panel panel-input">
            <h2>
                <button id="powerBtn" class="control-btn btn-power" onclick="toggleSystem()">⛔ OFF</button>
                <span style="color: var(--neon-cyan); margin-left: 5px;">AUDIO INPUT</span>
                <div class="calibration-control">
                    <span>SENS:</span>
                    <input type="range" id="filterRange" min="0" max="50" value="10" oninput="updateFilterLabel(this.value)">
                    <span id="filterValue">10c</span>
                </div>
            </h2>
            
            <div class="terminal-window" id="logTerminal">
                <div class="log-entry">> SISTEMA v3.6 STABLE.</div>
                <div class="log-entry">> BUFFER AUMENTADO: 600 chars.</div>
                <div class="log-entry">> PROTEÇÃO ANTI-DUPLICIDADE ATIVA.</div>
            </div>

            <div class="live-preview" id="livePreviewBox">
                <span id="interimText" style="opacity: 0.3;">...aguardando inicialização...</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #555; margin-top: 5px;">
                <span>[ENTER] para enviar</span>
                <span>Buffer: <span id="charCount">0</span>/600</span>
            </div>

            <button id="sendBtn" class="control-btn btn-send" onclick="forceSend()">📤 ENVIAR PACOTE (ENTER)</button>
        </div>

        <div class="panel panel-output">
            <h2>
                <span style="color: var(--neon-amber)">🧠 AI ANALYSIS</span>
                <span id="aiStatus" style="font-size: 0.7rem; color: #555; margin-left: auto;">STANDBY</span>
            </h2>

            <div class="ai-display-area" id="aiFeed">
                <div style="text-align: center; color: rgba(255,255,255,0.05); margin-top: 100px; font-size: 3rem;">📭</div>
            </div>
        </div>

        <div class="footer">TechPRO Ultimate v3.6 • Stable Build</div>
    </div>

    <script>
        // --- CONFIG ---
        const WEBHOOK_URL = 'https://n8n.squirrelstore.com.br/webhook/537866eb-700d-431a-83b5-13da0dcad0aa';
        const CHAR_LIMIT_TRIGGER = 600; // AUMENTADO DE 300 PARA 600

        // --- VARIAVEIS GLOBAIS ---
        let isSystemOn = false;
        let recognition = null;
        let currentBuffer = "";
        let minCharFilter = 10;
        let lastActivityTime = Date.now();
        let isSendingLock = false; // TRAVA CONTRA ENVIO DUPLO

        // --- DOM ---
        const logTerminal = document.getElementById('logTerminal');
        const interimText = document.getElementById('interimText');
        const livePreviewBox = document.getElementById('livePreviewBox');
        const aiFeed = document.getElementById('aiFeed');
        const powerBtn = document.getElementById('powerBtn');
        const aiStatus = document.getElementById('aiStatus');
        const charCountSpan = document.getElementById('charCount');
        const filterValueSpan = document.getElementById('filterValue');

        // --- BOOT ---
        window.onload = function() {
            const bootLog = document.getElementById('bootLog');
            const messages = ["Carregando módulos...", "Conectando ao n8n...", "Calibrando buffer...", "TechPRO Online."];
            let i = 0;
            const int = setInterval(() => { if(i<messages.length) bootLog.innerText = messages[i++]; }, 500);
            setTimeout(() => { clearInterval(int); document.getElementById('bootOverlay').style.opacity='0'; setTimeout(()=>{document.getElementById('bootOverlay').style.display='none'; document.getElementById('mainInterface').classList.add('system-ready');},500); }, 2200);
        };

        // --- WATCHDOG ---
        setInterval(() => {
            if (isSystemOn && (Date.now() - lastActivityTime > 5000)) {
                try { recognition.start(); } catch(e){}
            }
        }, 2000);

        // --- LOGIC ---
        function addLog(msg) {
            const t = new Date().toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit',second:'2-digit'});
            const d = document.createElement('div'); d.className='log-entry'; d.innerHTML=`<span class="log-timestamp">[${t}]</span> ${msg}`;
            logTerminal.appendChild(d); logTerminal.scrollTop=logTerminal.scrollHeight;
        }

        function updateFilterLabel(val) { minCharFilter = parseInt(val); filterValueSpan.innerText = val + "c"; }
        function copyToClipboard(txt, btn) { navigator.clipboard.writeText(txt).then(()=>{btn.innerHTML='✅';setTimeout(()=>btn.innerHTML='📋',2000);}); }
        function addAICard(ctx, res) {
            if(aiFeed.innerText.includes("📭")) aiFeed.innerHTML = "";
            const d = document.createElement('div'); d.className='ai-card';
            d.innerHTML=`<div class="ai-context">Contexto: "${ctx.substring(0,50)}..."</div><div class="ai-text">${res}</div><button class="copy-btn" onclick="copyToClipboard('${res.replace(/'/g, "\\'")}', this)">📋</button>`;
            aiFeed.prepend(d);
        }

        function toggleSystem() {
            isSystemOn = !isSystemOn; lastActivityTime = Date.now();
            if(isSystemOn) {
                powerBtn.innerHTML="⚡ ON"; powerBtn.classList.add("active"); interimText.innerText="...escutando..."; interimText.style.opacity="1"; addLog("SISTEMA LIGADO.");
                startRecognition();
            } else {
                powerBtn.innerHTML="⛔ OFF"; powerBtn.classList.remove("active"); interimText.innerText="...desligado..."; interimText.style.opacity="0.3"; addLog("SISTEMA DESLIGADO.");
                if(recognition) recognition.stop();
            }
        }

        // --- FUNÇÃO DE ENVIO COM TRAVA (BUGFIX DO ENVIO TRIPLO) ---
        function forceSend() {
            // Se estiver desligado, sem texto ou JÁ ENVIANDO, aborta.
            if (!isSystemOn || !currentBuffer || isSendingLock) return;

            // ATIVA A TRAVA
            isSendingLock = true;
            document.getElementById('sendBtn').disabled = true;

            addLog(">> ENVIO FORÇADO <<");
            
            // Envia e, independente do resultado, solta a trava depois
            enviarParaN8n(currentBuffer);

            // Reseta visual imediatamente
            interimText.innerText = "...";
            currentBuffer = "";
            updateCharCount(0);

            // Reinicia o motor para limpar o cache do navegador
            if(recognition) recognition.stop();

            // LIBERA A TRAVA APÓS 1.5 SEGUNDOS (Tempo de segurança)
            setTimeout(() => {
                isSendingLock = false;
                document.getElementById('sendBtn').disabled = false;
            }, 1500);
        }

        document.addEventListener('keydown', (e) => { if (e.key === 'Enter' && isSystemOn) forceSend(); });

        function startRecognition() {
            if (!('webkitSpeechRecognition' in window)) return alert("Use Chrome.");
            recognition = new webkitSpeechRecognition();
            recognition.continuous = true; recognition.interimResults = true; recognition.lang = 'pt-BR';
            recognition.onstart = () => { lastActivityTime = Date.now(); };
            recognition.onend = () => { if(isSystemOn) setTimeout(()=>{try{recognition.start();}catch(e){}}, 200); };
            
            recognition.onresult = (e) => {
                lastActivityTime = Date.now();
                let finalT = '', interimT = '';
                
                for (let i = e.resultIndex; i < e.results.length; ++i) {
                    if (e.results[i].isFinal) {
                        finalT = e.results[i][0].transcript.trim();
                        if (finalT.length > minCharFilter) {
                            // Se veio uma frase final, joga pro buffer e envia
                            currentBuffer = finalT; 
                            forceSend(); 
                        }
                    } else {
                        interimT += e.results[i][0].transcript;
                    }
                }

                if(interimT) {
                    currentBuffer = interimT;
                    interimText.innerText = interimT;
                    updateCharCount(interimT.length);
                    // AUTO SEND NO LIMITE DE 600
                    if(interimT.length > CHAR_LIMIT_TRIGGER) {
                        addLog("BUFFER CHEIO. DISPARANDO.");
                        forceSend();
                    }
                }
            };
            recognition.start();
        }

        function updateCharCount(c) {
            charCountSpan.innerText = c;
            if(c > CHAR_LIMIT_TRIGGER - 50) livePreviewBox.classList.add("buffer-warning");
            else livePreviewBox.classList.remove("buffer-warning");
            livePreviewBox.scrollTop = livePreviewBox.scrollHeight;
        }

        function enviarParaN8n(texto) {
            aiStatus.innerText = "ENVIANDO..."; aiStatus.style.color = "var(--neon-amber)";
            fetch(WEBHOOK_URL, {
                method: 'POST', headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ frase: texto })
            })
            .then(res => res.json())
            .then(data => {
                aiStatus.innerText = "RECEBIDO"; aiStatus.style.color = "#fff";
                if(data.comentario) addAICard(texto, data.comentario);
            })
            .catch(err => {
                console.error(err); aiStatus.innerText = "FALHA"; aiStatus.style.color = "red";
                addLog("Erro de Uplink.");
            });
        }
    </script>
</body>
</html>

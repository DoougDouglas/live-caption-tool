<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Uplink v3.1 - TechPRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a12;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-amber: #ffae00;
            --terminal-green: #39ff14;
            --glass-bg: rgba(20, 20, 35, 0.9);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 20, 0, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 20, 0, 0.2) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Share Tech Mono', monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden; /* Impede scroll na página toda */
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 95%;
            max-width: 1400px;
            height: 85vh; /* Altura fixa para garantir o layout */
        }

        /* Paineis Gerais */
        .panel {
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            height: 100%; /* Ocupa toda a altura do grid */
            box-sizing: border-box;
            overflow: hidden; /* O painel não rola, só o conteúdo dentro dele */
        }

        .panel-input { border-left: 3px solid var(--neon-cyan); }
        .panel-output { border-right: 3px solid var(--neon-amber); }

        h2 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 0;
            font-size: 1.1rem;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 15px;
            margin-bottom: 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-shrink: 0; /* Cabeçalho não encolhe */
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 4px 10px;
            background: rgba(0,0,0,0.6);
            border-radius: 4px;
            border: 1px solid rgba(255,255,255,0.1);
        }

        /* --- ÁREAS DE SCROLL --- */
        
        /* Terminal Esquerdo */
        .terminal-window {
            flex-grow: 1; /* Ocupa o espaço restante */
            background: rgba(0, 0, 0, 0.4);
            border: 1px solid rgba(0, 243, 255, 0.2);
            padding: 10px;
            overflow-y: auto; /* SCROLL AQUI */
            font-size: 0.85rem;
            margin-bottom: 15px;
        }

        /* Feed de IA Direito */
        .ai-display-area {
            flex-grow: 1; /* Ocupa o espaço restante */
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto; /* SCROLL AQUI */
            padding-right: 5px; /* Espaço para a scrollbar não colar */
            padding-bottom: 10px;
        }

        /* Estilização da Scrollbar (Webkit) */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a12; border-radius: 4px; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #555; }
        
        /* Cores específicas de scrollbar por painel */
        .terminal-window::-webkit-scrollbar-thumb { background: var(--neon-cyan); }
        .ai-display-area::-webkit-scrollbar-thumb { background: var(--neon-amber); }


        /* Cards da IA */
        .ai-card {
            background: rgba(255, 174, 0, 0.05);
            border: 1px solid var(--neon-amber);
            border-left: 4px solid var(--neon-amber);
            border-radius: 4px;
            padding: 15px;
            animation: slideIn 0.3s ease-out;
            position: relative;
            flex-shrink: 0; /* Garante que o card não seja esmagado */
        }
        
        .ai-context {
            font-size: 0.75rem;
            color: rgba(255, 255, 255, 0.5);
            margin-bottom: 8px;
            border-bottom: 1px dashed rgba(255, 174, 0, 0.3);
            padding-bottom: 5px;
        }

        .ai-text {
            font-size: 1rem;
            color: #fff;
            line-height: 1.5;
        }

        /* Input Live */
        .live-preview {
            flex-shrink: 0; /* Não encolhe */
            padding: 15px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            color: var(--neon-cyan);
            min-height: 50px;
            display: flex;
            align-items: center;
            font-size: 1.1rem;
        }

        .log-entry { margin-bottom: 4px; font-size: 0.8rem; opacity: 0.8; }
        .log-timestamp { color: var(--neon-pink); margin-right: 5px; }
        .footer { grid-column: 1 / -1; text-align: center; margin-top: 10px; font-size: 0.7rem; color: #555; }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>

    <div class="main-grid">
        
        <div class="panel panel-input">
            <h2>
                <span style="color: var(--neon-cyan)">📡 INPUT DE ÁUDIO</span>
                <div class="status-badge" id="statusBadge">OFFLINE</div>
            </h2>
            
            <div class="terminal-window" id="logTerminal">
                <div class="log-entry">> SISTEMA V3.1 PRONTO.</div>
                <div class="log-entry">> AGUARDANDO MICROFONE...</div>
            </div>

            <div class="live-preview">
                <span id="interimText">...aguardando...</span>
            </div>
        </div>

        <div class="panel panel-output">
            <h2>
                <span style="color: var(--neon-amber)">🧠 TECHPRO AI</span>
                <div class="status-badge" id="aiStatus">STANDBY</div>
            </h2>

            <div class="ai-display-area" id="aiFeed">
                <div style="text-align: center; color: rgba(255,255,255,0.1); margin-top: 100px; font-style: italic;">
                    O histórico de sugestões aparecerá aqui...
                </div>
            </div>
        </div>

        <div class="footer">TECHPRO SYSTEM v3.1</div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8n.squirrelstore.com.br/webhook/537866eb-700d-431a-83b5-13da0dcad0aa';
        
        const logTerminal = document.getElementById('logTerminal');
        const interimText = document.getElementById('interimText');
        const aiFeed = document.getElementById('aiFeed');
        const statusBadge = document.getElementById('statusBadge');
        const aiStatus = document.getElementById('aiStatus');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-timestamp">[${time}]</span> ${msg}`;
            logTerminal.appendChild(div);
            // Auto-scroll para baixo no terminal
            logTerminal.scrollTop = logTerminal.scrollHeight;
        }

        function addAICard(contexto, respostaIA) {
            if(aiFeed.innerText.includes("O histórico")) aiFeed.innerHTML = "";

            const card = document.createElement('div');
            card.className = 'ai-card';
            card.innerHTML = `
                <div class="ai-context">Frase: "${contexto}"</div>
                <div class="ai-text">${respostaIA}</div>
            `;
            
            // ADICIONA NO TOPO (Mais recente primeiro)
            aiFeed.prepend(card); 
            
            // Opcional: Se quiser que role para o topo automaticamente para ver o novo
            aiFeed.scrollTop = 0;
        }

        // --- VOZ ---
        const recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'pt-BR';

        recognition.onstart = () => {
            statusBadge.innerText = "ONLINE";
            statusBadge.style.color = "var(--terminal-green)";
            statusBadge.style.borderColor = "var(--terminal-green)";
        };

        recognition.onend = () => {
            statusBadge.innerText = "RECONECTANDO...";
            statusBadge.style.color = "red";
            setTimeout(() => recognition.start(), 1500);
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            let interimTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript = event.results[i][0].transcript.trim();
                    interimText.innerText = "...";
                    enviarParaN8n(finalTranscript);
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }
            if(interimTranscript) interimText.innerText = interimTranscript;
        };

        recognition.start();

        // --- CONEXÃO ---
        function enviarParaN8n(texto) {
            if(!texto) return;
            
            addLog(`Enviando pacote: "${texto.substring(0, 15)}..."`);
            aiStatus.innerText = "PROCESSANDO...";
            aiStatus.style.color = "var(--neon-amber)";
            aiStatus.style.borderColor = "var(--neon-amber)";

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ frase: texto })
            })
            .then(res => res.json())
            .then(data => {
                aiStatus.innerText = "RECEBIDO";
                aiStatus.style.color = "#fff";
                aiStatus.style.borderColor = "rgba(255,255,255,0.2)";
                
                if(data.comentario) {
                    addAICard(texto, data.comentario);
                    addLog("Resposta recebida com sucesso.");
                } else {
                    addAICard(texto, "⚠️ Erro: N8N não retornou campo 'comentario'.");
                }
            })
            .catch(err => {
                console.error(err);
                aiStatus.innerText = "ERRO";
                aiStatus.style.color = "red";
                addLog("Falha na conexão com N8N.");
            });
        }
    </script>
</body>
</html>

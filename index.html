<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Uplink v3.0 - TechPRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a12;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-amber: #ffae00; /* Nova cor para IA */
            --terminal-green: #39ff14;
            --glass-bg: rgba(20, 20, 35, 0.85);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            background-image: 
                linear-gradient(rgba(0, 20, 0, 0.2) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 20, 0, 0.2) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Share Tech Mono', monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr; /* Dividido em 2 colunas */
            gap: 20px;
            width: 95%;
            max-width: 1200px;
            height: 80vh;
        }

        /* Paineis Gerais */
        .panel {
            background: var(--glass-bg);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5);
            position: relative;
        }

        /* Painel Esquerdo: Input de Voz */
        .panel-input {
            border-left: 3px solid var(--neon-cyan);
        }

        /* Painel Direito: Output da IA */
        .panel-output {
            border-right: 3px solid var(--neon-amber);
            box-shadow: inset 0 0 50px rgba(255, 174, 0, 0.05);
        }

        h2 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 0;
            font-size: 1.2rem;
            letter-spacing: 2px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .status-badge {
            font-size: 0.7rem;
            padding: 2px 8px;
            background: rgba(0,0,0,0.5);
            border-radius: 4px;
        }

        /* Área de Terminal (Esquerda) */
        .terminal-window {
            flex-grow: 1;
            background: rgba(0, 0, 0, 0.6);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 10px;
            overflow-y: auto;
            font-family: 'Share Tech Mono', monospace;
            font-size: 0.9rem;
            margin-top: 10px;
        }

        /* Área de IA (Direita) */
        .ai-display-area {
            flex-grow: 1;
            display: flex;
            flex-direction: column;
            gap: 15px;
            overflow-y: auto;
            padding-top: 10px;
        }

        .ai-card {
            background: rgba(255, 174, 0, 0.05);
            border: 1px solid var(--neon-amber);
            border-radius: 5px;
            padding: 15px;
            animation: slideIn 0.5s ease-out;
            position: relative;
        }
        
        .ai-card::before {
            content: "SUGESTÃO IA";
            position: absolute;
            top: -10px;
            right: 10px;
            background: var(--bg-color);
            color: var(--neon-amber);
            font-size: 0.7rem;
            padding: 0 5px;
            border: 1px solid var(--neon-amber);
        }

        .ai-text {
            font-size: 1.1rem;
            color: #fff;
            line-height: 1.4;
        }

        .ai-context {
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.4);
            margin-bottom: 8px;
            font-style: italic;
        }

        /* Input em tempo real */
        .live-preview {
            margin-top: 15px;
            padding: 10px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            color: var(--neon-cyan);
            min-height: 40px;
            display: flex;
            align-items: center;
        }

        /* Logs e Cores */
        .log-entry { margin-bottom: 5px; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 2px;}
        .log-timestamp { color: var(--neon-pink); font-size: 0.8em; margin-right: 5px; }
        .txt-cyan { color: var(--neon-cyan); }
        
        /* Rodapé */
        .footer {
            grid-column: 1 / -1;
            text-align: center;
            font-size: 0.8rem;
            color: rgba(255, 255, 255, 0.3);
            margin-top: 10px;
        }
        .blink { animation: blink 1s infinite; }

        @keyframes slideIn {
            from { opacity: 0; transform: translateX(20px); }
            to { opacity: 1; transform: translateX(0); }
        }
        @keyframes blink { 50% { opacity: 0; } }

        /* Responsividade para telas menores */
        @media (max-width: 768px) {
            .main-grid { grid-template-columns: 1fr; height: auto; }
            .panel { height: 400px; }
        }
    </style>
</head>
<body>

    <div class="main-grid">
        
        <div class="panel panel-input">
            <h2>
                <span class="txt-cyan">📡 INPUT DE ÁUDIO</span>
                <div class="status-badge" id="statusBadge" style="color: var(--terminal-green)">ONLINE</div>
            </h2>
            
            <div class="terminal-window" id="logTerminal">
                <div class="log-entry">> SISTEMA INICIADO...</div>
                <div class="log-entry">> MICROFONE CONECTADO.</div>
            </div>

            <div class="live-preview">
                <span id="interimText">...aguardando voz...</span>
            </div>
        </div>

        <div class="panel panel-output">
            <h2>
                <span style="color: var(--neon-amber)">🧠 TECHPRO AI CORE</span>
                <div class="status-badge" id="aiStatus">AGUARDANDO DADOS</div>
            </h2>

            <div class="ai-display-area" id="aiFeed">
                <div style="text-align: center; color: rgba(255,255,255,0.2); margin-top: 50px;">
                    NENHUMA ANÁLISE RECEBIDA AINDA
                </div>
            </div>
        </div>

        <div class="footer">
            SISTEMA DESENVOLVIDO POR <strong style="color: var(--neon-cyan)">TECHPRO</strong> <span class="blink">|</span>
        </div>
    </div>

    <script>
        // --- CONFIGURAÇÃO ---
        const WEBHOOK_URL = 'https://n8n.squirrelstore.com.br/webhook/537866eb-700d-431a-83b5-13da0dcad0aa';
        // --------------------

        const logTerminal = document.getElementById('logTerminal');
        const interimText = document.getElementById('interimText');
        const aiFeed = document.getElementById('aiFeed');
        const statusBadge = document.getElementById('statusBadge');
        const aiStatus = document.getElementById('aiStatus');

        function addLog(msg) {
            const time = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit'});
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-timestamp">[${time}]</span> ${msg}`;
            logTerminal.appendChild(div);
            logTerminal.scrollTop = logTerminal.scrollHeight;
        }

        function addAICard(contexto, respostaIA) {
            // Remove o texto de "vazio" se for a primeira mensagem
            if(aiFeed.innerText.includes("NENHUMA ANÁLISE")) aiFeed.innerHTML = "";

            const card = document.createElement('div');
            card.className = 'ai-card';
            card.innerHTML = `
                <div class="ai-context">Pastor disse: "${contexto}"</div>
                <div class="ai-text">${respostaIA}</div>
            `;
            aiFeed.prepend(card); // Adiciona no topo
        }

        // --- RECONHECIMENTO DE VOZ ---
        const recognition = new webkitSpeechRecognition();
        recognition.continuous = true;
        recognition.interimResults = true;
        recognition.lang = 'pt-BR';

        recognition.onstart = () => {
            statusBadge.innerText = "ONLINE";
            statusBadge.style.color = "var(--terminal-green)";
        };

        recognition.onend = () => {
            statusBadge.innerText = "RECONECTANDO...";
            statusBadge.style.color = "red";
            setTimeout(() => recognition.start(), 1000);
        };

        recognition.onresult = (event) => {
            let finalTranscript = '';
            let interimTranscript = '';

            for (let i = event.resultIndex; i < event.results.length; ++i) {
                if (event.results[i].isFinal) {
                    finalTranscript = event.results[i][0].transcript.trim();
                    enviarParaN8n(finalTranscript);
                    interimText.innerText = "...";
                } else {
                    interimTranscript += event.results[i][0].transcript;
                }
            }

            if(interimTranscript) interimText.innerText = interimTranscript;
        };

        recognition.start();

        // --- ENVIO E RECEBIMENTO DO N8N ---
        function enviarParaN8n(texto) {
            if(!texto) return;
            
            addLog(`Enviando: "${texto.substring(0, 20)}..."`);
            aiStatus.innerText = "PROCESSANDO...";
            aiStatus.style.color = "var(--neon-amber)";

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    frase: texto,
                    timestamp: new Date().toISOString()
                })
            })
            .then(response => {
                // Aqui é o pulo do gato: Esperamos a resposta JSON do n8n
                return response.json(); 
            })
            .then(data => {
                // Sucesso! O n8n devolveu algo
                console.log("Resposta n8n:", data);
                addLog("Recebido do Core AI.");
                aiStatus.innerText = "AGUARDANDO DADOS";
                aiStatus.style.color = "#fff";

                // O campo 'comentario' depende de como você nomeou no nó "Respond to Webhook"
                if(data.comentario) {
                    addAICard(texto, data.comentario);
                } else {
                    addAICard(texto, "Resposta recebida mas sem campo 'comentario'. Verifique o n8n.");
                }
            })
            .catch(err => {
                console.error(err);
                addLog("Erro de conexão/timeout.");
                aiStatus.innerText = "ERRO";
                aiStatus.style.color = "red";
            });
        }
    </script>
</body>
</html>

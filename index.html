<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Audio Uplink v3.4 - TechPRO</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Share+Tech+Mono&display=swap" rel="stylesheet">

    <style>
        :root {
            --bg-color: #0a0a12;
            --neon-cyan: #00f3ff;
            --neon-pink: #ff00ff;
            --neon-amber: #ffae00;
            --neon-red: #ff3333;
            --terminal-green: #39ff14;
            --glass-bg: rgba(20, 20, 35, 0.95);
        }

        body {
            margin: 0;
            padding: 0;
            height: 100vh;
            background-color: var(--bg-color);
            background-image: linear-gradient(rgba(0, 20, 0, 0.2) 1px, transparent 1px), linear-gradient(90deg, rgba(0, 20, 0, 0.2) 1px, transparent 1px);
            background-size: 30px 30px;
            font-family: 'Share Tech Mono', monospace;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
        }

        .main-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
            width: 95%;
            max-width: 1400px;
            height: 90vh;
        }

        .panel {
            background: var(--glass-bg);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 10px;
            padding: 20px;
            display: flex;
            flex-direction: column;
            box-shadow: 0 0 30px rgba(0, 0, 0, 0.6);
            height: 100%;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        .panel-input { border-left: 3px solid var(--neon-cyan); }
        .panel-output { border-right: 3px solid var(--neon-amber); }

        h2 {
            font-family: 'Orbitron', sans-serif;
            margin-top: 0;
            font-size: 0.9rem;
            letter-spacing: 1px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.2);
            padding-bottom: 10px;
            margin-bottom: 10px;
            display: flex;
            gap: 10px;
            align-items: center;
            flex-wrap: wrap;
        }

        /* SLIDER DE CALIBRAGEM */
        .calibration-control {
            display: flex;
            align-items: center;
            gap: 10px;
            font-size: 0.7rem;
            color: var(--neon-cyan);
            border: 1px solid rgba(0, 243, 255, 0.3);
            padding: 5px 10px;
            border-radius: 5px;
            margin-left: auto; /* Empurra pra direita */
        }
        
        input[type=range] {
            width: 100px;
            accent-color: var(--neon-cyan);
        }

        .control-btn {
            background: transparent;
            border: 1px solid #555;
            color: #777;
            padding: 4px 10px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            border-radius: 4px;
            transition: all 0.2s;
            font-size: 0.7rem;
            display: flex;
            align-items: center;
            gap: 5px;
            text-transform: uppercase;
        }
        
        .btn-power.active { border-color: var(--terminal-green); color: var(--terminal-green); box-shadow: 0 0 10px rgba(57,255,20,0.2); }
        .btn-send { border-color: var(--neon-cyan); color: var(--neon-cyan); width: 100%; justify-content: center; margin-top: 10px; padding: 10px;}
        .btn-send:hover { background: rgba(0, 243, 255, 0.2); }
        .btn-send:active { transform: scale(0.95); }

        /* SCROLLBARS E TERMINAL */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: #0a0a12; }
        ::-webkit-scrollbar-thumb { background: #333; border-radius: 4px; }
        .terminal-window { flex-grow: 1; background: rgba(0,0,0,0.4); border: 1px solid rgba(0,243,255,0.2); padding: 10px; overflow-y: auto; font-size: 0.85rem; margin-bottom: 10px; }
        .ai-display-area { flex-grow: 1; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; padding-right: 5px; padding-bottom: 10px; }

        .ai-card {
            background: rgba(255, 174, 0, 0.05);
            border: 1px solid var(--neon-amber);
            border-left: 4px solid var(--neon-amber);
            border-radius: 4px;
            padding: 15px; padding-right: 40px;
            animation: slideIn 0.3s ease-out;
            position: relative; flex-shrink: 0;
        }
        .ai-context { font-size: 0.75rem; color: rgba(255,255,255,0.5); margin-bottom: 5px; border-bottom: 1px dashed rgba(255,174,0,0.3); padding-bottom: 5px; }
        .ai-text { font-size: 1rem; color: #fff; line-height: 1.4; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: rgba(0,0,0,0.3); border: 1px solid var(--neon-amber); color: var(--neon-amber); width: 25px; height: 25px; border-radius: 4px; cursor: pointer; display: flex; align-items: center; justify-content: center; }

        .live-preview {
            flex-shrink: 0;
            padding: 10px;
            background: rgba(0, 243, 255, 0.05);
            border: 1px dashed var(--neon-cyan);
            color: var(--neon-cyan);
            height: 70px; max-height: 70px;
            overflow-y: auto;
            font-size: 0.9rem;
            word-wrap: break-word;
            position: relative;
        }
        
        .buffer-warning { border-color: var(--neon-red); color: var(--neon-red); animation: pulse-red 1s infinite; }
        .log-entry { margin-bottom: 3px; font-size: 0.75rem; opacity: 0.8; }
        .log-timestamp { color: var(--neon-pink); margin-right: 5px; }
        .footer { grid-column: 1 / -1; text-align: center; margin-top: 5px; font-size: 0.7rem; color: #555; }

        @keyframes slideIn { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse-red { 50% { background-color: rgba(255, 50, 50, 0.1); } }
    </style>
</head>
<body>

    <div class="main-grid">
        <div class="panel panel-input">
            <h2>
                <button id="powerBtn" class="control-btn btn-power" onclick="toggleSystem()">⛔ OFF</button>
                <span style="color: var(--neon-cyan)">INPUT</span>
                
                <div class="calibration-control">
                    <span>FILTRO:</span>
                    <input type="range" id="filterRange" min="0" max="50" value="10" oninput="updateFilterLabel(this.value)">
                    <span id="filterValue">10 chars</span>
                </div>
            </h2>
            
            <div class="terminal-window" id="logTerminal">
                <div class="log-entry">> SISTEMA v3.4 CARREGADO.</div>
                <div class="log-entry">> FILTRO DE RUÍDO: ATIVO (Min 10 chars).</div>
            </div>

            <div class="live-preview" id="livePreviewBox">
                <span id="interimText" style="opacity: 0.5;">...sistema desligado...</span>
            </div>
            
            <div style="display: flex; justify-content: space-between; align-items: center; font-size: 0.7rem; color: #555; margin-top: 2px;">
                <span>Pressione ENTER para enviar</span>
                <span>Buffer: <span id="charCount">0</span>/300</span>
            </div>

            <button id="sendBtn" class="control-btn btn-send" onclick="forceSend()">📤 ENVIAR AGORA (ENTER)</button>
        </div>

        <div class="panel panel-output">
            <h2>
                <span style="color: var(--neon-amber)">🧠 TECHPRO AI</span>
                <span id="aiStatus" style="font-size: 0.7rem; color: #555; margin-left: auto;">STANDBY</span>
            </h2>

            <div class="ai-display-area" id="aiFeed">
                <div style="text-align: center; color: rgba(255,255,255,0.1); margin-top: 100px;">
                    Histórico vazio...
                </div>
            </div>
        </div>

        <div class="footer">TECHPRO SYSTEM v3.4 - COM FILTRO DE RUÍDO</div>
    </div>

    <script>
        const WEBHOOK_URL = 'https://n8n.squirrelstore.com.br/webhook/537866eb-700d-431a-83b5-13da0dcad0aa';
        const CHAR_LIMIT_TRIGGER = 300; 
        
        // Elementos DOM
        const logTerminal = document.getElementById('logTerminal');
        const interimText = document.getElementById('interimText');
        const livePreviewBox = document.getElementById('livePreviewBox');
        const aiFeed = document.getElementById('aiFeed');
        const powerBtn = document.getElementById('powerBtn');
        const aiStatus = document.getElementById('aiStatus');
        const charCountSpan = document.getElementById('charCount');
        const filterValueSpan = document.getElementById('filterValue');

        // Estados
        let isSystemOn = false;
        let recognition = null;
        let currentBuffer = "";
        let minCharFilter = 10; // Valor inicial do filtro

        // LOGS
        function addLog(msg) {
            const time = new Date().toLocaleTimeString('pt-BR', {hour:'2-digit', minute:'2-digit', second:'2-digit'});
            const div = document.createElement('div');
            div.className = 'log-entry';
            div.innerHTML = `<span class="log-timestamp">[${time}]</span> ${msg}`;
            logTerminal.appendChild(div);
            logTerminal.scrollTop = logTerminal.scrollHeight;
        }

        function updateFilterLabel(val) {
            minCharFilter = parseInt(val);
            filterValueSpan.innerText = val + " chars";
        }

        function copyToClipboard(text, btn) {
            navigator.clipboard.writeText(text).then(() => {
                btn.innerHTML = '✅';
                setTimeout(() => btn.innerHTML = '📋', 2000);
            });
        }

        function addAICard(contexto, respostaIA) {
            if(aiFeed.innerText.includes("Histórico")) aiFeed.innerHTML = "";
            const card = document.createElement('div');
            card.className = 'ai-card';
            card.innerHTML = `
                <div class="ai-context">"${contexto.substring(0, 60)}..."</div>
                <div class="ai-text">${respostaIA}</div>
                <button class="copy-btn" onclick="copyToClipboard('${respostaIA.replace(/'/g, "\\'")}', this)">📋</button>
            `;
            aiFeed.prepend(card);
        }

        // --- CONTROLES ---
        function toggleSystem() {
            isSystemOn = !isSystemOn;
            if (isSystemOn) {
                powerBtn.innerHTML = "⚡ ON";
                powerBtn.classList.add("active");
                interimText.innerText = "...aguardando voz...";
                interimText.style.opacity = "1";
                addLog("SISTEMA LIGADO.");
                startRecognition();
            } else {
                powerBtn.innerHTML = "⛔ OFF";
                powerBtn.classList.remove("active");
                interimText.innerText = "...desligado...";
                interimText.style.opacity = "0.5";
                addLog("SISTEMA DESLIGADO.");
                if(recognition) recognition.stop();
            }
        }

        function forceSend() {
            if (!isSystemOn || !currentBuffer) return;
            addLog(">> CORTE MANUAL ACIONADO <<");
            enviarParaN8n(currentBuffer);
            interimText.innerText = "...";
            currentBuffer = "";
            updateCharCount(0);
            if(recognition) recognition.stop(); 
        }

        document.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && isSystemOn) forceSend();
        });

        // --- RECONHECIMENTO ---
        function startRecognition() {
            if (!('webkitSpeechRecognition' in window)) return alert("Use Chrome.");

            recognition = new webkitSpeechRecognition();
            recognition.continuous = true;
            recognition.interimResults = true;
            recognition.lang = 'pt-BR';

            recognition.onend = () => {
                if (isSystemOn) setTimeout(() => recognition.start(), 500);
            };

            recognition.onresult = (event) => {
                let finalTranscript = '';
                let interimTranscript = '';

                for (let i = event.resultIndex; i < event.results.length; ++i) {
                    if (event.results[i].isFinal) {
                        finalTranscript = event.results[i][0].transcript.trim();
                        
                        // LÓGICA DO FILTRO: Só envia se for maior que o Slider
                        if (finalTranscript.length > minCharFilter) {
                            enviarParaN8n(finalTranscript);
                            interimText.innerText = "...";
                            currentBuffer = "";
                            updateCharCount(0);
                        } else if (finalTranscript.length > 0) {
                            addLog(`Ignorado (Curto: ${finalTranscript.length} chars): "${finalTranscript}"`);
                        }

                    } else {
                        interimTranscript += event.results[i][0].transcript;
                    }
                }
                
                if(interimTranscript) {
                    currentBuffer = interimTranscript;
                    interimText.innerText = interimTranscript;
                    updateCharCount(interimTranscript.length);
                    if(interimTranscript.length > CHAR_LIMIT_TRIGGER) {
                        addLog("BUFFER CHEIO. ENVIANDO AUTOMATICAMENTE.");
                        forceSend();
                    }
                }
            };
            recognition.start();
        }

        function updateCharCount(count) {
            charCountSpan.innerText = count;
            if(count > CHAR_LIMIT_TRIGGER - 50) livePreviewBox.classList.add("buffer-warning");
            else livePreviewBox.classList.remove("buffer-warning");
            livePreviewBox.scrollTop = livePreviewBox.scrollHeight;
        }

        // --- ENVIO N8N ---
        function enviarParaN8n(texto) {
            addLog(`Enviando: "${texto.substring(0, 15)}..."`);
            aiStatus.innerText = "PROCESSANDO...";
            aiStatus.style.color = "var(--neon-amber)";

            fetch(WEBHOOK_URL, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ frase: texto })
            })
            .then(res => res.json())
            .then(data => {
                aiStatus.innerText = "PRONTO";
                aiStatus.style.color = "#fff";
                if(data.comentario) addAICard(texto, data.comentario);
            })
            .catch(err => {
                console.error(err);
                aiStatus.innerText = "ERRO";
                aiStatus.style.color = "red";
            });
        }
    </script>
</body>
</html>
